services:
  ledger:
    image: postgres:16-alpine
    container_name: celesto-ledger
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    volumes:
      - ./seeds:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celesto-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://ledger:ledger@ledger:5432/ledger
      API_PORT: 8080
      CELESTO_PROVIDER: cloud
      CELESTO_BACKEND: firecracker
      CELESTO_API_KEY: replace-me
      LLM_BASE_URL: https://example-llm-host/v1
      LLM_API_KEY: replace-me
      LLM_MODEL: replace-with-a-model-name
      APP_ENV: production
      LOG_LEVEL: INFO
      AUDIT_LOG_PATH: logs/commands.jsonl
    depends_on:
      ledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
